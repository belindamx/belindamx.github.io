<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 370" role="img" aria-labelledby="title desc">
<title id="title">Randomized AI summary experiment</title>
<desc id="desc">Opinions and perceived public support are measured before and after reading. Participants are randomly assigned to the same post and comments, either without a summary in the control group or with an AI summary in the treatment group. Paths show study sequence, not outcomes.</desc>
